[package]
name = "aether-server"
version = "0.1.0"
edition = "2021"
description = "Opaque encrypted-envelope relay for Aether"

[dependencies]
aether-crypto = { git = "https://github.com/existence6269/aether-protocol.git", rev = "f335bc666df3a0768fd171f5c7249bf9a2286e20" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
# webauthn-rs-core requires OpenSSL; vendoring keeps server builds independent of host OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.4", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
