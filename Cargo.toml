[package]
name = "aether-server"
version = "0.1.0"
edition = "2021"
description = "Opaque encrypted-envelope relay for Aether"

[dependencies]
aether-crypto = { git = "https://github.com/existence6269/aether-protocol.git", tag = "v0.1.0" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
